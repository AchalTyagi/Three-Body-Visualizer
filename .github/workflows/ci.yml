name: Gravity Lab CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # UTF-8 stdout on Windows runners (the self-test prints ε, ², —)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install package
        run: python -m pip install -e .
      - name: Import smoke test
        run: python -c "import gravity_lab; import gravity_lab.ui.main_window; import gravity_lab.renderer_vtk; import gravity_lab.preferences"
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run regression suite (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Run regression suite
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Run physics self-checks
        run: python main.py --selftest
      - name: Run benchmark smoke test
        run: python benchmarks/run_benchmarks.py --steps 20 --profile-iterations 100 --output benchmark-results/ci-smoke.json
