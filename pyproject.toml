[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-lab-3d"
version = "1.0.0"
description = "Interactive Newtonian three-body dynamics and orbital diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "vtk>=9.2"]

[project.optional-dependencies]
astrophysics = ["rebound>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gravity-lab = "gravity_lab.cli:main"
gravity-lab-selftest = "gravity_lab.cli:selftest_main"

[tool.setuptools.packages.find]
include = ["gravity_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
